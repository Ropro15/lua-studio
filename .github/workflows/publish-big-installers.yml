name: publish-big-installers

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct download URL for the 500 MB APK
        required: true
        type: string
      ipa_url:
        description: Direct download URL for the 500 MB IPA
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download installers
        env:
          APK_URL: ${{ inputs.apk_url }}
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o out/LuaStudio-Android.apk "$APK_URL"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o out/LuaStudio-iOS-unsigned.ipa "$IPA_URL"
          stat -c '%n %s' out/*
          test "$(stat -c %s out/LuaStudio-Android.apk)" -eq 500000000
          test "$(stat -c %s out/LuaStudio-iOS-unsigned.ipa)" -eq 500000000
          sha256sum out/*
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.0.1 out/LuaStudio-Android.apk out/LuaStudio-iOS-unsigned.ipa --clobber --repo Ropro15/lua-studio
